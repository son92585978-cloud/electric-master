grid;place-items:center;background:#273651;border-radius:12px;color:#fbd66a;font-weight:800}.lesson .detail{flex:1}.lesson b{display:block}.lesson p{margin:4px 0 0;font-size:12px;color:#aab9d2}.done{color:#5de0a5}.nav{position:fixed;bottom:0;left:0;right:0;background:#0e1729ed;border-top:1px solid #2d3b53;display:flex;justify-content:center;padding:9px 6px max(9px,env(safe-area-inset-bottom));z-index:3}.nav-inner{max-width:920px;width:100%;display:flex;justify-content:space-around}.nav button{border:0;background:transparent;color:#9bacc9;font-size:12px;min-width:62px;padding:5px}.nav button.active{color:#facc62}.nav .ico{display:block;font-size:20px;margin-bottom:3px}.panel{padding:20px;margin:13px 0;line-height:1.75}.panel h3{margin:0 0 10px;color:#ffe0a0}.panel p{margin:9px 0}.back{background:none;color:#d7e5ff;border:0;padding:10px 0;margin-bottom:10px}.tag{display:inline-block;border:1px solid #475673;color:#a9c4f2;border-radius:20px;padding:4px 9px;font-size:12px;margin-right:5px}.formula{background:#0d1629;border:1px solid #354969;border-radius:12px;padding:15px;margin:12px 0;text-align:center;font-size:22px;color:#ffda84;font-weight:800}.btn{border:0;background:#f7c55c;color:#192033;border-radius:12px;padding:13px 17px;font-weight:800}.btn.secondary{background:#283954;color:#e4efff}.btn.outline{background:transparent;border:1px solid #4a6080;color:#e5eeff}.btn:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.choice{display:block;width:100%;text-align:left;padding:13px 15px;border:1px solid #35435e;border-radius:12px;background:#101b2f;color:#e6efff;margin:9px 0}.choice.selected{border-color:#f9c95f;background:#283348}.choice.correct{border-color:#36cf95;background:#123c38}.choice.wrong{border-color:#fa7e7e;background:#432633}.feedback{background:#1d2c42;border-radius:12px;padding:15px;margin:13px 0}.empty{text-align:center;padding:32px;color:#a8b7d0}.list-line{padding:13px 0;border-bottom:1px solid #2c3952}. .lesson:focus-visible,.btn:focus-visible,.choice:focus-visible,.tile:focus-visible{outline:3px solid #f7c55c;outline-offset:2px}.panel h3:not(:first-child){margin-top:24px}.panel p{word-break:keep-all}.hero{box-shadow:0 14px 40px #03081655}@media(max-width:430px){.app{padding-left:13px;padding-right:13px}.head{font-size:20px}.hero h1{font-size:23px}.panel{padding:16px}.nav button{min-width:54px}} .deep{margin:16px 0;padding:22px;border:1px solid #385078;border-radius:18px;background:#15223b}.deep h2{margin-top:0}.deep h3{margin-top:24px}.deep p,.deep li{line-height:1.85}.deep ol{padding-left:23px}.diagram{background:#0c172b;border:1px solid #304568;border-radius:14px;padding:12px;margin:14px 0}.diagram svg{display:block;width:100%;max-height:245px}.note{background:#243451;border-left:4px solid #f8c65c;padding:13px;border-radius:8px;line-height:1.7}.calcrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.calcrow label{display:grid;gap:7px}.calcrow input{width:100%;padding:12px;border-radius:9px;background:#0c172b;border:1px solid #506184;color:white}@media(max-width:400px){.deep{padding:15px}} .formula-small{font-size:15px;line-height:1.8;text-align:left;word-break:keep-all}.deep .btn{margin-top:8px} .step{margin:9px 0;border:1px solid #3c5478;border-radius:12px;padding:10px 13px;background:#101e35}.step summary{cursor:pointer;font-weight:700;color:#f7c65d}.step p{margin:12px 0 2px;line-height:1.75}.v8detail{margin-top:18px;padding:14px;border:1px solid #4c638e;border-radius:12px;background:#18253d}.v8detail details{margin-top:10px}.v8detail summary{cursor:pointer;font-weight:700}.v8detail li{margin:9px 0;line-height:1.5}</style></head><body><div id="app" class="app"></div><nav class="nav"><div class="nav-inner" id="nav"></div></nav><script>
const LESSONS=[
{id:1,title:'전기의 기본 원리',sub:'전압 · 전류 · 저항 · 옴의 법칙',category:'기초',time:35,sections:[['전압 (Voltage, V)','전류를 흐르게 하는 전위차입니다. 물을 밀어내는 압력 차이처럼 생각하면 쉽습니다. 전압의 단위는 볼트(V)입니다.'],['전류 (Current, I)','전하가 단위 시간 동안 이동하는 양입니다. 수도관에 흐르는 물의 양처럼 생각해 보세요. 단위는 암페어(A)입니다.'],['저항 (Resistance, R)','전류의 흐름을 방해하는 정도입니다. 가는 수도관은 물이 흐르기 어렵듯, 저항이 크면 같은 전압에서 전류가 줄어듭니다. 단위는 옴(Ω)입니다.'],['옴의 법칙 (Ohm’s Law)','전압(V) = 전류(I) × 저항(R)입니다. 따라서 전류를 구할 때는 I = V ÷ R, 저항을 구할 때는 R = V ÷ I를 사용합니다.'],['계산 예제','전압이 12V, 저항이 4Ω이라면 I = 12 ÷ 4 = 3A입니다. 전압 24V, 저항 6Ω이면 전류는 4A입니다.'],["전하와 전류의 관계","전류 I=Q/t입니다. 1초에 2쿨롱(C)의 전하가 지나가면 전류는 2A입니다."],["전력과 에너지","직류에서 P=VI입니다. 12V에서 2A가 흐르면 24W이며 1시간 사용하면 24Wh입니다."],["헷갈리기 쉬운 개념","전압은 전위차, 전류는 전하 흐름, 저항은 전류를 방해하는 성질입니다. 세 단위 V·A·Ω를 구별하세요."]]},
{id:2,title:'전기 기초 수학',sub:'단위 변환 · 분수 · 지수 · 삼각함수',category:'기초',time:40,sections:[['단위 변환','1kV = 1,000V, 1mA = 0.001A입니다. k(킬로)는 1,000배, m(밀리)는 1/1,000배를 뜻합니다.'],['식 정리','V=IR에서 전류 I를 구하려면 양변을 R로 나누어 I=V/R로 정리합니다.'],['제곱과 제곱근','전력 공식 P=I²R에서 I²는 I×I입니다. 3²=9이며 √9=3입니다.'],['삼각함수 예고','교류에서는 sin, cos와 위상각을 사용합니다. 기초 단계에서는 직각삼각형의 비율이라는 개념을 익히면 됩니다.'],["지수 계산","10³=1000, 10⁻³=0.001입니다. 250mA는 0.25A이고 0.5kΩ은 500Ω입니다."],["계산기 연습","공학용 계산기로 괄호·제곱·제곱근을 연습하세요. 계산 순서는 괄호→거듭제곱→곱셈·나눗셈→덧셈·뺄셈입니다."]]},
{id:3,title:'회로이론 및 제어공학',sub:'직류 · 교류 · 직렬·병렬 · 제어',category:'필기',time:45,sections:[['직렬 회로','저항이 일렬로 연결되면 합성저항은 R=R₁+R₂입니다. 직렬 회로에는 같은 전류가 흐릅니다.'],['병렬 회로','두 저항의 병렬 합성저항은 R=(R₁R₂)/(R₁+R₂)입니다. 병렬 가지에는 같은 전압이 걸립니다.'],['교류 기초','교류는 시간에 따라 방향과 크기가 변합니다. 주파수(Hz)는 1초 동안 반복되는 횟수입니다.'],['제어공학','목표값과 실제 출력의 차이를 이용해 동작을 조절하는 피드백 제어를 배웁니다.'],["키르히호프 전류법칙","하나의 접속점으로 들어오는 전류의 합은 나가는 전류의 합과 같습니다. 들어오는 전류가 5A이고 한 갈래가 2A면 나머지는 3A입니다."],["키르히호프 전압법칙","폐회로를 한 바퀴 돌며 계산한 전압의 대수합은 0입니다. 전원 12V와 저항 전압강하 5V·7V가 균형을 이룹니다."],["교류의 실효값","정현파 전압의 실효값은 최대값/√2입니다. 최대값이 약 311V이면 실효값은 약 220V입니다."]]},
{id:4,title:'전기자기학',sub:'전하 · 전계 · 자계 · 전자유도',category:'필기',time:45,sections:[['전하와 전계','전하는 전기적 성질을 갖는 양이며, 전계는 전하가 전기력을 미치는 공간의 상태를 나타냅니다.'],['자계','전류가 흐르는 도선 주변에는 자기장이 생깁니다.'],['전자유도','자기선속이 시간에 따라 변하면 유도기전력이 발생합니다. 발전기의 핵심 원리입니다.'],["쿨롱의 법칙","두 점전하 사이 힘은 전하량의 곱에 비례하고 거리의 제곱에 반비례합니다."],["패러데이 법칙","코일을 통과하는 자기선속이 빠르게 변할수록 유도기전력의 크기가 커집니다. 변화에 반대하는 방향은 렌츠의 법칙으로 설명합니다."]]},
{id:5,title:'전기기기',sub:'변압기 · 발전기 · 전동기',category:'필기',time:45,sections:[['변압기','교류 전압을 높이거나 낮추는 장치입니다. 이상적인 변압기에서는 전압비가 권수비와 같습니다.'],['발전기','기계적 에너지를 전기에너지로 변환합니다.'],['전동기','전기에너지를 회전 운동 등 기계적 에너지로 바꿉니다.'],["변압기 권수비 예제","이상적인 변압기에서 N1:N2=10:1, 1차 220V이면 2차는 22V입니다."],["전동기와 발전기 구분","전동기는 전기→기계 에너지, 발전기는 기계→전기 에너지로 변환합니다."]]},
{id:6,title:'전력공학',sub:'발전 · 송전 · 배전 · 전력손실',category:'필기',time:45,sections:[['발전·송전·배전','발전소에서 만든 전기를 송전선과 배전망을 거쳐 수용가에 공급합니다.'],['송전 손실','도선의 저항으로 생기는 손실은 P손실=I²R입니다. 같은 전력을 보낼 때 전압을 높이면 전류를 낮출 수 있습니다.'],['보호 장치','차단기와 계전기는 사고가 발생했을 때 설비를 보호하는 역할을 합니다.'],["송전전압의 효과","동일한 유효전력을 보낼 때 전압을 높이면 전류를 낮출 수 있어 I²R 손실을 줄일 수 있습니다. 역률과 조건은 동일하다고 가정합니다."],["3상 전력 입문","평형 3상에서 유효전력 P=√3×선간전압×선전류×역률입니다."]]},
{id:7,title:'전기설비기술기준',sub:'접지 · 보호 · 안전기준',category:'필기',time:45,sections:[['전기설비 안전','감전과 화재를 예방하기 위해 전기설비의 설치 및 보호 기준을 배웁니다.'],['접지','이상 상태에서 감전 위험과 설비 손상을 줄이기 위한 보호수단입니다.'],['규정 확인','법령과 한국전기설비규정(KEC)은 개정될 수 있으므로 실제 응시 연도 최신 기준을 확인하세요.'],["누전차단기와 과전류차단기","누전차단기는 누설전류 감지, 과전류차단기는 과부하·단락 보호가 핵심입니다. 제품별 겸용 기능은 다를 수 있습니다."],["실무 안전","충전부 작업은 자격을 갖춘 작업자가 적절한 차단·검전·보호 절차에 따라 수행해야 합니다. 앱 설명만으로 실제 배선 작업을 하지 마세요."]]},
{id:8,title:'필기 기출 유형 연습',sub:'계산문제 · 개념문제 · 오답 복습',category:'문제',time:50,sections:[['기출 유형 학습','자주 출제되는 옴의 법칙, 전력, 저항 합성 등 핵심 유형부터 반복합니다.'],['오답 관리','틀린 문제는 오답노트에 자동으로 저장됩니다. 해설을 읽고 다시 풀어보세요.'],['출처 안내','앱에 수록된 문항은 학습용 자체 제작 문제입니다. 실제 국가시험 기출문제를 그대로 수록한 것은 아닙니다.'],["오답 복습 루틴","문제를 풀고 오답의 원인을 개념 부족·공식 착각·계산 실수로 나누세요. 1일·1주 후 다시 풀어보세요."],["학습 전략","실제 시험 연도 출제기준과 최신 KEC를 큐넷에서 확인하세요. 이 앱은 자체 제작 학습문항을 제공합니다."]]},
{id:9,title:'전기기사 실기 입문',sub:'전기설비설계 및 관리 · 필답형',category:'실기',time:45,sections:[['실기 개요','전기설비설계 및 관리에 관한 계산과 서술형 답안을 연습합니다.'],['답안 연습','단위를 빠뜨리지 않고 계산 과정을 명확하게 쓰는 습관을 들이세요.'],['학습 순서','필기 기초를 다진 뒤 실기 계산 유형을 단계적으로 추가 학습합니다.']]}

QS.push(...[{"id": 110, "lesson": 10, "q": "2Ω과 4Ω을 직렬 연결한 합성저항은?", "opts": ["3Ω", "6Ω", "8Ω", "1Ω"], "a": 1, "why": "직렬 2Ω과 4Ω은 6Ω, 병렬 2Ω과 4Ω은 4/3Ω입니다. 직렬 회로는 전류가 같고 병렬 회로는 전압이 같습니다."}, {"id": 111, "lesson": 11, "q": "5A 유입, 2A 유출일 때 나머지 유출 전류는?", "opts": ["7A", "2A", "3A", "10A"], "a": 2, "why": "5A가 유입되고 2A가 한 가지로 나가면 다른 가지에는 3A가 흐릅니다. 전압법칙(KVL)은 닫힌 회로에서 전압 상승과 강하의 대수합이 0입니다."}, {"id": 112, "lesson": 12, "q": "60Hz 교류의 주기는 약 얼마인가?", "opts": ["0.0167초", "60초", "1초", "6초"], "a": 0, "why": "주파수가 60Hz라면 주기 T=1/60초≈0.0167초입니다. 저항 R과 리액턴스 X를 합쳐 임피던스 Z로 다룹니다."}, {"id": 113, "lesson": 13, "q": "전하 간 거리를 2배로 늘리면 힘은?", "opts": ["2배", "1/2배", "1/4배", "4배"], "a": 2, "why": "두 전하 사이 거리가 2배가 되면 힘은 1/4배가 됩니다(다른 조건 동일). F=k|q₁q₂|/r²의 단위를 확인하세요."}, {"id": 114, "lesson": 14, "q": "전하 2C에 힘 6N이 작용할 때 전계는?", "opts": ["12N/C", "3N/C", "4N/C", "8N/C"], "a": 1, "why": "전하 2C가 6N의 힘을 받으면 E=3N/C입니다. 전위차(V)는 단위 전하당 에너지 차이입니다."}, {"id": 115, "lesson": 15, "q": "자속 변화 속도가 2배면 유도기전력 크기는?", "opts": ["변화 없음", "2배", "1/2배", "4배"], "a": 1, "why": "같은 코일에서 자속 변화 속도가 2배면 유도기전력 크기도 2배입니다. 렌츠 법칙은 유도전류의 방향이 자속 변화에 반대하도록 정해진다는 내용입니다."}, {"id": 116, "lesson": 16, "q": "이상 변압기 220V, 권수비 10:1의 2차 전압은?", "opts": ["2200V", "110V", "22V", "2.2V"], "a": 2, "why": "1차 220V, 권수비 10:1이면 2차 전압은 22V입니다. 실제 변압기에는 동손과 철손 등 손실이 있습니다."}, {"id": 117, "lesson": 17, "q": "입력 1000W, 출력 850W의 효율은?", "opts": ["15%", "85%", "100%", "115%"], "a": 1, "why": "전동기 입력 1000W, 출력 850W라면 효율은 85%입니다. 효율 η=(출력/입력)×100%입니다."}, {"id": 118, "lesson": 18, "q": "동기속도 1800rpm, 회전자 1710rpm의 슬립은?", "opts": ["0.5%", "5%", "10%", "95%"], "a": 1, "why": "동기속도 1800rpm, 실제 회전자속도 1710rpm이면 슬립은 0.05(5%)입니다. 동기속도 Ns=120f/P이며 P는 극수입니다."}, {"id": 119, "lesson": 19, "q": "평형 3상 유효전력 공식은?", "opts": ["VI", "√3 VI cosφ", "I²/R", "V/R"], "a": 1, "why": "선간전압 200V, 선전류 10A, 역률 1이면 P≈3464W입니다. 단상 P=VIcosφ와 혼동하지 않도록 합니다."}, {"id": 120, "lesson": 20, "q": "전류가 2배가 되면 저항손실은?", "opts": ["2배", "4배", "1/2배", "8배"], "a": 1, "why": "전류가 2배가 되면 동일 저항의 손실은 4배입니다. 같은 전 1:`<div class="deep"><h2>⚡ 1회차 심화 · 눈으로 이해하기</h2><p>전기는 <b>전위차(전압)</b>가 있을 때 닫힌 경로에서 전하가 움직이는 현상입니다. 아래는 12V 전원에 4Ω 저항을 연결한 단순 직류 회로입니다.</p><div class="diagram"><svg viewBox="0 0 350 185" role="img" aria-label="12볼트 전원과 4옴 저항이 직렬로 연결된 닫힌 회로"><path d="M65 50 H270 V135 H65 V50" stroke="#8ac5ff" stroke-width="4" fill="none"/><rect x="248" y="76" width="44" height="36" rx="5" fill="#263f62" stroke="#f8c65c" stroke-width="3"/><text x="270" y="99" text-anchor="middle" fill="white" font-size="14">4Ω</text><rect x="49" y="77" width="32" height="37" fill="#101e34"/><path d="M65 76 V86 M51 86 H79 M56 98 H74 M65 98 V115" stroke="#f8c65c" stroke-width="3"/><text x="92" y="105" fill="white" font-size="14">12V</text><path d="M162 43 l14 7 -14 7" stroke="#6ee7b7" fill="none" stroke-width="3"/><text x="178" y="36" fill="#6ee7b7" font-size="13">전류 3A →</text></svg></div><h3>① 식을 고르는 순서</h3><ol><li>알고 있는 값: V = 12V, R = 4Ω</li><li>구할 값: 전류 I</li><li>옴의 법칙: I = V ÷ R</li><li>대입: I = 12 ÷ 4 = <b>3A</b></li></ol><h3>② 단위까지 기억하기</h3><p>전압 V(볼트), 전류 A(암페어), 저항 Ω(옴), 전력 W(와트)는 서로 다른 물리량입니다. 문자 V는 전압 기호와 볼트 단위에 모두 쓰이므로 문맥을 보세요.</p><h3>③ 전력까지 연결하기</h3><p>이 저항에서 소비되는 전력은 P = VI = 12 × 3 = <b>36W</b>입니다. 또는 P = I²R = 3² × 4 = 36W로 검산할 수 있습니다.</p><div class="note">⚠️ 물 흐름 비유는 이해를 위한 단순화입니다. 실제 전류는 전하의 흐름이며 전기 작업은 감전 위험이 있으므로 실습은 안전교육·적절한 장비를 갖춘 환경에서만 하세요.</div><h3>🔢 옴의 법칙 계산기</h3><p class="muted small">전압과 저항을 입력하면 전류와 전력을 계산합니다.</p><div class="calcrow"><label>전압(V)<input type="number" id="cv" value="12" min="0" step="any" oninput="calcOhm()"></label><label>저항(Ω)<input type="number" id="cr" value="4" min="0.00001" step="any" oninput="calcOhm()"></label></div><div id="calc-result" class="formula" aria-live="polite">전류 3A · 전력 36W</div><button class="btn secondary" onclick="startQuiz('lesson',1)">1회차 계산문제 풀기 →</button></div>`,
2:`<div class="deep"><h2>📐 2회차 심화 · 계산이 쉬워지는 3가지</h2><h3>① 접두어를 단위로 바꾸기</h3><p>1kV = 1,000V, 1mA = 0.001A, 1MΩ = 1,000,000Ω입니다. 계산하기 전에 단위를 V·A·Ω로 통일하세요.</p><h3>② 식 변형</h3><div class="formula">V = IR　→　I = V/R　→　R = V/I</div><p>예: 전압 20V, 전류 2A라면 R = 20 ÷ 2 = <b>10Ω</b>.</p><h3>③ 제곱과 계산 순서</h3><p>P = I²R에서 I=3A, R=2Ω라면 3²×2 = 9×2 = <b>18W</b>입니다. 먼저 제곱한 뒤 곱하세요.</p><div class="note">시험 계산 습관: 주어진 값 → 구할 값 → 공식 → 대입 → 단위 순서로 적어보세요.</div></div>`,
3:`<div class="deep"><h2>🔌 3회차 심화 · 직렬과 병렬 비교</h2><div class="diagram"><svg viewBox="0 0 350 185" role="img" aria-label="직렬 저항 두 개와 병렬 저항 두 개의 회로 비교"><text x="20" y="24" fill="white" font-size="15">직렬</text><path d="M20 65 H320" stroke="#8ac5ff" stroke-width="3"/><rect x="82" y="48" width="60" height="34" rx="5" fill="#263f62" stroke="#f8c65c" stroke-width="2"/><rect x="196" y="48" width="60" height="34" rx="5" fill="#263f62" stroke="#f8c65c" stroke-width="2"/><text x="112" y="70" fill="white" text-anchor="middle">3Ω</text><text x="226" y="70" fill="white" text-anchor="middle">5Ω</text><text x="20" y="116" fill="white" font-size="15">병렬</text><path d="M20 148 H60 V125 H285 V148 H320 M60 148 V170 H285 V148" stroke="#8ac5ff" stroke-width="3" fill="none"/><rect x="148" y="111" width="55" height="28" rx="5" fill="#263f62" stroke="#f8c65c" stroke-width="2"/><rect x="148" y="157" width="55" height="26" rx="5" fill="#263f62" stroke="#f8c65c" stroke-width="2"/><text x="175" y="130" fill="white" text-anchor="middle">6Ω</text><text x="175" y="175" fill="white" text-anchor="middle">6Ω</text></svg></div><h3>직렬 회로</h3><p>전류가 지나가는 길이 하나입니다. 같은 전류가 흐르고, 저항은 더합니다. 3Ω + 5Ω = <b>8Ω</b>.</p><h3>병렬 회로</h3><p>전류가 갈라지는 여러 길이 있습니다. 각 가지 양단 전압이 같습니다. 6Ω 두 개 병렬이면 합성저항은 <b>3Ω</b>.</p><div class="formula">직렬: R = R₁ + R₂<br>병렬: R = (R₁ × R₂)/(R₁ + R₂)</div><div class="note">주의: 병렬 저항의 합성저항은 각각의 저항보다 작습니다.</div></div>`};
DEEP[4]=`<div class="deep"><h2>📘 전기자기학 심화</h2><h3>① 핵심 개념</h3><p>전계(Electric Field)와 자계(Magnetic Field)는 서로 다른 개념입니다. 전하는 전계를 만들고, 움직이는 전하인 전류는 자계를 만듭니다.</p><h3>② 단계별 예제</h3><div class="note">전하 Q=2μC가 3초 동안 이동한다면 I=Q/t=0.667μA입니다. μ(마이크로)는 10⁻⁶입니다.</div><h3>③ 꼭 알아둘 이론</h3><p>전자유도(Electromagnetic Induction)는 코일을 통과하는 자기선속이 시간에 따라 변할 때 기전력이 발생하는 현상입니다. 패러데이 법칙 e=−N·ΔΦ/Δt에서 N은 권수, Φ는 자기선속(Wb)입니다. 음수 부호는 렌츠의 법칙에 따른 방향을 뜻합니다.</p><h3>④ 적용 및 검산</h3><div class="formula formula-small">N=100회, 자기선속 변화량 0.02Wb, 변화시간 0.5초이면 유도기전력 크기는 100×0.02÷0.5=4V입니다.</div><button class="btn secondary" onclick="startQuiz('lesson',4)">4회차 연습문제 풀기 →</button></div>`;
DEEP[5]=`<div class="deep"><h2>📘 전기기기 심화</h2><h3>① 핵심 개념</h3><p>변압기(Transformer)는 교류 전압을 변환합니다. 이상적인 변압기에서는 V₁/V₂=N₁/N₂이며 손실을 무시하면 V₁I₁=V₂I₂입니다.</p><h3>② 단계별 예제</h3><div class="note">1차 220V, 1차 권수 1000회, 2차 권수 100회라면 V₂=220×100/1000=22V입니다.</div><h3>③ 꼭 알아둘 이론</h3><p>전동기(Motor)는 전기→기계, 발전기(Generator)는 기계→전기로 에너지를 변환합니다. 효율(Efficiency) η=출력/입력×100%입니다.</p><h3>④ 적용 및 검산</h3><div class="formula formula-small">입력 1000W, 출력 850W인 전동기의 효율은 850/1000×100=85%입니다.</div><button class="btn secondary" onclick="startQuiz('lesson',5)">5회차 연습문제 풀기 →</button></div>`;
DEEP[6]=`<div class="deep"><h2>📘 전력공학 심화</h2><h3>① 핵심 개념</h3><p>송전(Transmission)은 먼 거리로 전력을 보내는 과정이고 배전(Distribution)은 수용가로 전력을 공급하는 과정입니다.</p><h3>② 단계별 예제</h3><div class="note">도선 저항 R=2Ω, 전류 I=10A라면 선로 손실 P=I²R=10²×2=200W입니다. 같은 저항에서 전류가 5A로 감소하면 50W입니다.</div><h3>③ 꼭 알아둘 이론</h3><p>평형 3상 유효전력(Three-phase Active Power)은 P=√3×V_L×I_L×cosφ입니다. V_L은 선간전압, I_L은 선전류, cosφ는 역률입니다.</p><h3>④ 적용 및 검산</h3><div class="formula formula-small">선간전압 380V, 선전류 10A, 역률 0.8이면 P≈1.732×380×10×0.8=5265W≈5.27kW입니다.</div><button class="btn secondary" onclick="startQuiz('lesson',6)">6회차 연습문제 풀기 →</button></div>`;
DEEP[7]=`<div class="deep"><h2>📘 전기설비기술기준 심화</h2><h3>① 핵심 개념</h3><p>접지(Earthing)는 고장 시 감전 위험을 줄이기 위한 보호수단입니다. 단순히 땅에 선을 연결하면 모든 위험이 사라지는 것은 아닙니다.</p><h3>② 단계별 예제</h3><div class="note">과전류 보호(Overcurrent Protection)는 과부하와 단락을 대상으로 하며, 누전 보호(Earth Leakage Protection)는 누설전류로 인한 위험을 줄입니다. 장치의 겸용 여부는 제품에 따라 다릅니다.</div><h3>③ 꼭 알아둘 이론</h3><p>보호도체(Protective Conductor, PE)와 중성선(Neutral, N)은 목적이 다릅니다. 현장에서는 임의로 결선하거나 교체해서는 안 됩니다.</p><h3>④ 적용 및 검산</h3><div class="formula formula-small">이 단원은 계산 예제보다 최신 한국전기설비규정(KEC)과 안전 개념을 정확히 구분하는 연습이 중요합니다. 시험 연도의 최신 기준을 확인하세요.</div><button class="btn secondary" onclick="startQuiz('lesson',7)">7회차 연습문제 풀기 →</button></div>`;
DEEP[8]=`<div class="deep"><h2>📘 필기 기출 유형 학습 심화</h2><h3>① 핵심 개념</h3><p>문제풀이 순서는 ①주어진 값 확인 ②단위 통일 ③공식 선택 ④대입 ⑤답과 단위 검산입니다.</p><h3>② 단계별 예제</h3><div class="note">24V 전원에 4Ω과 8Ω 저항을 직렬 연결하면 R=12Ω, I=24/12=2A입니다. 각 저항 전압강하는 8V, 16V이며 합계 24V로 검산됩니다.</div><h3>③ 꼭 알아둘 이론</h3><p>오답 원인을 개념 착각·공식 선택 오류·단위 오류·계산 실수로 나누세요. 틀린 문제는 하루 뒤와 일주일 뒤 다시 풀이합니다.</p><h3>④ 적용 및 검산</h3><div class="formula formula-small">앱 문제는 자체 제작 연습문제입니다. 실제 연도별 기출 원문으로 표시하지 않습니다.</div><button class="btn secondary" onclick="startQuiz('lesson',8)">8회차 연습문제 풀기 →</button></div>`;
DEEP[9]=`<div class="deep"><h2>📘 전기기사 실기 입문 심화</h2><h3>① 핵심 개념</h3><p>실기 필답형에서는 전기설비설계 및 관리의 계산과 서술을 연습합니다. 필기 이론을 기반으로 단선결선도, 보호장치, 부하설비 등의 개념을 단계적으로 확장합니다.</p><h3>② 단계별 예제</h3><div class="note">예시: 220V 단상 부하의 유효전력 1.1kW, 역률 1이라고 가정하면 전류 I=P/V=1100/220=5A입니다. 실제 교류 부하는 역률과 조건을 확인해야 합니다.</div><h3>③ 꼭 알아둘 이론</h3><p>계산 답안은 공식 → 숫자 대입 → 계산 → 단위 순서로 작성하고, 설계·규정 문제는 해당 시험 연도 출제기준을 따릅니다.</p><h3>④ 적용 및 검산</h3><div class="formula formula-small">실제 설비 작업이나 보호장치 선정은 자격을 갖춘 담당자의 설계·검토와 안전 절차가 필요합니다.</div><button class="btn secondary" onclick="startQuiz('lesson',9)">9회차 연습문제 풀기 →</button></div>`;
function calcOhm(){const v=Number(document.getElementById('cv')?.value),r=Number(document.getElementById('cr')?.value),out=document.getElementById('calc-result');if(!out)return;if(!Number.isFinite(v)||!Number.isFinite(r)||v<0||r<=0){out.textContent='전압은 0 이상, 저항은 0보다 큰 수를 입력하세요.';return}const f=x=>Number(x.toPrecision(6)).toLocaleString('ko-KR');out.textContent='전류 '+f(v/r)+'A · 전력 '+f(v*v/r)+'W'}

{id:115,lesson:5,q:"전동기의 에너지 변환 방향은?",opts:["전기→기계", "기계→전기", "빛→전기", "열→화학"],a:0,why:"전동기는 전기에너지를 기계에너지로 변환합니다."},
{id:116,lesson:6,q:"선로 저항 2Ω, 전류 10A일 때 저항 손실은?",opts:["20W", "50W", "100W", "200W"],a:3,why:"P=I²R=10²×2=200W."},
{id:117,lesson:6,q:"선로 저항이 일정하고 전류가 절반이면 I²R 손실은?",opts:["절반", "1/4", "2배", "4배"],a:1,why:"손실은 전류의 제곱에 비례하므로 (1/2)²=1/4입니다."},
{id:118,lesson:6,q:"평형 3상 유효전력 공식은?",opts:["P=VI", "P=√3 V_L I_L cosφ", "P=I/R", "P=V²I"],a:1,why:"평형 3상 유효전력은 √3×선간전압×선전류×역률입니다."},
{id:119,lesson:7,q:"과부하 및 단락 보호에 대표적으로 사용되는 장치는?",opts:["과전류차단기", "스위치만", "변압기만", "콘센트"],a:0,why:"과전류차단기는 과부하 및 단락에 대한 보호를 담당합니다."},
{id:120,lesson:7,q:"보호도체 PE의 주된 목적은?",opts:["주파수 조절", "보호접지 경로 제공", "부하전류의 정상 귀로 대체", "역률 개선"],a:1,why:"PE는 고장 시 보호 목적의 경로이며 중성선과 구별됩니다."},
{id:121,lesson:7,q:"전기설비 규정 공부 시 올바른 방법은?",opts:["오래된 기준만 암기", "시험 연도의 최신 KEC 확인", "규정은 모두 불변", "현장 임의 결선"],a:1,why:"법규 및 KEC는 개정될 수 있어 최신 기준 확인이 중요합니다."},
{id:122,lesson:8,q:"24V에 4Ω, 8Ω을 직렬 연결하면 전류는?",opts:["1A", "2A", "3A", "6A"],a:1,why:"합성저항 12Ω, I=24/12=2A."},
{id:123,lesson:8,q:"위 회로에서 8Ω 저항의 전압강하는?",opts:["4V", "8V", "12V", "16V"],a:3,why:"I=2A이므로 V=IR=2×8=16V."},
{id:124,lesson:8,q:"계산문제 풀이 순서로 적절한 것은?",opts:["답 추측→검산 생략", "단위 확인→공식→대입→검산", "정답만 외우기", "단위 무시"],a:1,why:"단위를 먼저 통일하고 공식을 선택한 뒤 검산합니다."},
{id:125,lesson:9,q:"단상 220V, 유효전력 1100W, 역률 1일 때 전류는?",opts:["0.2A", "2A", "5A", "10A"],a:2,why:"I=P/(V×역률)=1100/220=5A."},
{id:126,lesson:9,q:"실기 계산 답안의 바람직한 구성은?",opts:["숫자만", "공식→대입→계산→단위", "단위 생략", "결론만 추측"],a:1,why:"계산 과정과 단위를 명확히 적는 습관이 중요합니다."},
{id:127,lesson:9,q:"실제 현장 보호장치 선정에 대한 올바른 설명은?",opts:["앱 예제만 보고 결정", "자격자 검토와 최신 규정 확인", "임의 교체", "정격 무시"],a:1,why:"실제 설비는 담당 자격자와 규정에 따라 검토해야 합니다."}
);
DEEP[10]="<div class=\"deep\"><h2>📚 10회차 교재형 심화 · 저항의 직렬·병렬</h2><span class=\"tag\">Series and Parallel Circuits</span><h3>① 원리부터 이해하기</h3><p>직렬에서는 전류가 같고 병렬에서는 전압이 같습니다.</p><div class=\"diagram\"><svg viewBox=\"0 0 340 115\" role=\"img\" aria-label=\"저항의 직렬·병렬 개념과 공식 흐름도\"><rect x=\"7\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#87c9ff\"/><rect x=\"121\" y=\"17\" width=\"98\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#f7c65d\"/><rect x=\"236\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#6ee7b7\"/><path d=\"M105 57 H119 M219 57 H235\" stroke=\"#f7c65d\" stroke-width=\"3\"/><text x=\"55\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">원리</text><text x=\"55\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">이해</text><text x=\"170\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">공식</text><text x=\"170\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">선택</text><text x=\"285\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">대입</text><text x=\"285\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">검산</text></svg></div><h3>② 꼭 기억할 공식</h3><div class=\"formula formula-small\">R직렬=R₁+R₂, R병렬=R₁R₂/(R₁+R₂)</div><h3>③ 실제 계산·판단 예제</h3><p><b>문제 상황:</b> 12V 전원에 2Ω과 4Ω 직렬</p><details class=\"step\"><summary>1단계 · 조건 정리 보기</summary><p>① 합성저항 2+4=6Ω</p></details><details class=\"step\"><summary>2단계 · 공식 적용 보기</summary><p>② 전류 I=12/6=2A</p></details><details class=\"step\"><summary>3단계 · 정답과 검산 보기</summary><p>③ 각 전압강하 4V와 8V, 합계 12V</p></details><h3>④ 시험에서 조심할 점</h3><div class=\"note\">직렬에서는 각 저항의 전압이 달라도 전류는 같습니다.</div><button class=\"btn secondary\" onclick=\"startQuiz('lesson',10)\">10회차 연습문제 풀기 →</button></div>";
DEEP[11]="<div class=\"deep\"><h2>📚 11회차 교재형 심화 · 키르히호프 법칙</h2><span class=\"tag\">Kirchhoff’s Laws</span><h3>① 원리부터 이해하기</h3><p>전류법칙(KCL)은 접점에 들어오는 전류의 합과 나가는 전류의 합이 같다는 뜻입니다.</p><div class=\"diagram\"><svg viewBox=\"0 0 340 115\" role=\"img\" aria-label=\"키르히호프 법칙 개념과 공식 흐름도\"><rect x=\"7\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#87c9ff\"/><rect x=\"121\" y=\"17\" width=\"98\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#f7c65d\"/><rect x=\"236\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#6ee7b7\"/><path d=\"M105 57 H119 M219 57 H235\" stroke=\"#f7c65d\" stroke-width=\"3\"/><text x=\"55\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">원리</text><text x=\"55\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">이해</text><text x=\"170\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">공식</text><text x=\"170\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">선택</text><text x=\"285\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">대입</text><text x=\"285\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">검산</text></svg></div><h3>② 꼭 기억할 공식</h3><div class=\"formula formula-small\">ΣI유입 = ΣI유출</div><h3>③ 실제 계산·판단 예제</h3><p><b>문제 상황:</b> 한 접점에 5A와 2A가 들어오고 4A가 나감</p><details class=\"step\"><summary>1단계 · 조건 정리 보기</summary><p>① 들어오는 전류 합 5+2=7A</p></details><details class=\"step\"><summary>2단계 · 공식 적용 보기</summary><p>② 나가는 전류 합 4+I</p></details><details class=\"step\"><summary>3단계 · 정답과 검산 보기</summary><p>③ 7=4+I, I=3A</p></details><h3>④ 시험에서 조심할 점</h3><div class=\"note\">전압법칙(KVL)은 폐회로를 따라 전압의 대수합이 0이라는 법칙입니다.</div><button class=\"btn secondary\" onclick=\"startQuiz('lesson',11)\">11회차 연습문제 풀기 →</button></div>";
DEEP[12]="<div class=\"deep\"><h2>📚 12회차 교재형 심화 · 교류의 기본</h2><span class=\"tag\">Alternating Current</span><h3>① 원리부터 이해하기</h3><p>교류는 전압·전류의 크기와 방향이 시간에 따라 변합니다. 실효값(RMS)은 같은 저항에서 같은 열을 내는 직류값입니다.</p><div class=\"diagram\"><svg viewBox=\"0 0 340 115\" role=\"img\" aria-label=\"교류의 기본 개념과 공식 흐름도\"><rect x=\"7\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#87c9ff\"/><rect x=\"121\" y=\"17\" width=\"98\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#f7c65d\"/><rect x=\"236\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#6ee7b7\"/><path d=\"M105 57 H119 M219 57 H235\" stroke=\"#f7c65d\" stroke-width=\"3\"/><text x=\"55\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">원리</text><text x=\"55\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">이해</text><text x=\"170\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">공식</text><text x=\"170\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">선택</text><text x=\"285\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">대입</text><text x=\"285\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">검산</text></svg></div><h3>② 꼭 기억할 공식</h3><div class=\"formula formula-small\">정현파 실효값 V=V최대/√2</div><h3>③ 실제 계산·판단 예제</h3><p><b>문제 상황:</b> 최대값 311V인 정현파</p><details class=\"step\"><summary>1단계 · 조건 정리 보기</summary><p>① 정현파임을 확인</p></details><details class=\"step\"><summary>2단계 · 공식 적용 보기</summary><p>② 311÷1.414</p></details><details class=\"step\"><summary>3단계 · 정답과 검산 보기</summary><p>③ 실효값 약 220V</p></details><h3>④ 시험에서 조심할 점</h3><div class=\"note\">최대값·실효값·평균값을 혼동하지 마세요. 정현파 조건에서만 이 공식을 바로 씁니다.</div><button class=\"btn secondary\" onclick=\"startQuiz('lesson',12)\">12회차 연습문제 풀기 →</button></div>";
DEEP[13]="<div class=\"deep\"><h2>📚 13회차 교재형 심화 · 쿨롱의 법칙</h2><span class=\"tag\">Coulomb’s Law</span><h3>① 원리부터 이해하기</h3><p>두 점전하 사이의 힘은 전하량의 곱에 비례하고 거리 제곱에 반비례합니다.</p><div class=\"diagram\"><svg viewBox=\"0 0 340 115\" role=\"img\" aria-label=\"쿨롱의 법칙 개념과 공식 흐름도\"><rect x=\"7\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#87c9ff\"/><rect x=\"121\" y=\"17\" width=\"98\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#f7c65d\"/><rect x=\"236\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#6ee7b7\"/><path d=\"M105 57 H119 M219 57 H235\" stroke=\"#f7c65d\" stroke-width=\"3\"/><text x=\"55\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">원리</text><text x=\"55\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">이해</text><text x=\"170\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">공식</text><text x=\"170\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">선택</text><text x=\"285\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">대입</text><text x=\"285\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">검산</text></svg></div><h3>② 꼭 기억할 공식</h3><div class=\"formula formula-small\">F=k|q₁q₂|/r²</div><h3>③ 실제 계산·판단 예제</h3><p><b>문제 상황:</b> 전하량이 일정한 두 점전하의 거리를 2배로 늘림</p><details class=\"step\"><summary>1단계 · 조건 정리 보기</summary><p>① 분모 r² 확인</p></details><details class=\"step\"><summary>2단계 · 공식 적용 보기</summary><p>② 거리 2배이면 분모 4배</p></details><details class=\"step\"><summary>3단계 · 정답과 검산 보기</summary><p>③ 힘은 기존의 1/4</p></details><h3>④ 시험에서 조심할 점</h3><div class=\"note\">같은 부호 전하는 밀어내고 다른 부호 전하는 끌어당깁니다.</div><button class=\"btn secondary\" onclick=\"startQuiz('lesson',13)\">13회차 연습문제 풀기 →</button></div>";
DEEP[14]="<div class=\"deep\"><h2>📚 14회차 교재형 심화 · 전계와 전위</h2><span class=\"tag\">Electric Field and Potential</span><h3>① 원리부터 이해하기</h3><p>전계는 단위 양전하가 받는 힘, 전위차는 단위 전하당 에너지 차이입니다.</p><div class=\"diagram\"><svg viewBox=\"0 0 340 115\" role=\"img\" aria-label=\"전계와 전위 개념과 공식 흐름도\"><rect x=\"7\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#87c9ff\"/><rect x=\"121\" y=\"17\" width=\"98\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#f7c65d\"/><rect x=\"236\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#6ee7b7\"/><path d=\"M105 57 H119 M219 57 H235\" stroke=\"#f7c65d\" stroke-width=\"3\"/><text x=\"55\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">원리</text><text x=\"55\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">이해</text><text x=\"170\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">공식</text><text x=\"170\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">선택</text><text x=\"285\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">대입</text><text x=\"285\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">검산</text></svg></div><h3>② 꼭 기억할 공식</h3><div class=\"formula formula-small\">E=F/q, V=W/q</div><h3>③ 실제 계산·판단 예제</h3><p><b>문제 상황:</b> 2C 전하를 이동시키는 데 10J의 일 필요</p><details class=\"step\"><summary>1단계 · 조건 정리 보기</summary><p>① 전위차 정의 V=W/q</p></details><details class=\"step\"><summary>2단계 · 공식 적용 보기</summary><p>② 10J ÷ 2C</p></details><details class=\"step\"><summary>3단계 · 정답과 검산 보기</summary><p>③ 전위차 5V</p></details><h3>④ 시험에서 조심할 점</h3><div class=\"note\">전계 E(V/m)와 전위차 V(V)는 단위부터 다릅니다.</div><button class=\"btn secondary\" onclick=\"startQuiz('lesson',14)\">14회차 연습문제 풀기 →</button></div>";
DEEP[15]="<div class=\"deep\"><h2>📚 15회차 교재형 심화 · 전자유도</h2><span class=\"tag\">Electromagnetic Induction</span><h3>① 원리부터 이해하기</h3><p>코일을 지나는 자기선속이 변하면 유도기전력이 생깁니다.</p><div class=\"diagram\"><svg viewBox=\"0 0 340 115\" role=\"img\" aria-label=\"전자유도 개념과 공식 흐름도\"><rect x=\"7\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#87c9ff\"/><rect x=\"121\" y=\"17\" width=\"98\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#f7c65d\"/><rect x=\"236\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#6ee7b7\"/><path d=\"M105 57 H119 M219 57 H235\" stroke=\"#f7c65d\" stroke-width=\"3\"/><text x=\"55\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">원리</text><text x=\"55\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">이해</text><text x=\"170\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">공식</text><text x=\"170\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">선택</text><text x=\"285\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">대입</text><text x=\"285\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">검산</text></svg></div><h3>② 꼭 기억할 공식</h3><div class=\"formula formula-small\">|e|=N|ΔΦ|/Δt</div><h3>③ 실제 계산·판단 예제</h3><p><b>문제 상황:</b> 100회 코일, 자기선속 0.03Wb 변화, 0.5초</p><details class=\"step\"><summary>1단계 · 조건 정리 보기</summary><p>① N=100</p></details><details class=\"step\"><summary>2단계 · 공식 적용 보기</summary><p>② 선속변화량 0.03Wb, 시간 0.5s</p></details><details class=\"step\"><summary>3단계 · 정답과 검산 보기</summary><p>③ 100×0.03/0.5=6V</p></details><h3>④ 시험에서 조심할 점</h3><div class=\"note\">음의 부호는 유도기전력의 방향(렌츠의 법칙)을 나타냅니다.</div><button class=\"btn secondary\" onclick=\"startQuiz('lesson',15)\">15회차 연습문제 풀기 →</button></div>";
DEEP[16]="<div class=\"deep\"><h2>📚 16회차 교재형 심화 · 변압기 원리</h2><span class=\"tag\">Transformer</span><h3>① 원리부터 이해하기</h3><p>이상적인 변압기는 교류에서 권수비에 따라 전압을 변환합니다.</p><div class=\"diagram\"><svg viewBox=\"0 0 340 115\" role=\"img\" aria-label=\"변압기 원리 개념과 공식 흐름도\"><rect x=\"7\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#87c9ff\"/><rect x=\"121\" y=\"17\" width=\"98\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#f7c65d\"/><rect x=\"236\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#6ee7b7\"/><path d=\"M105 57 H119 M219 57 H235\" stroke=\"#f7c65d\" stroke-width=\"3\"/><text x=\"55\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">원리</text><text x=\"55\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">이해</text><text x=\"170\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">공식</text><text x=\"170\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">선택</text><text x=\"285\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">대입</text><text x=\"285\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">검산</text></svg></div><h3>② 꼭 기억할 공식</h3><div class=\"formula formula-small\">V₁/V₂=N₁/N₂</div><h3>③ 실제 계산·판단 예제</h3><p><b>문제 상황:</b> 1차 220V, 1차 1000회, 2차 200회</p><details class=\"step\"><summary>1단계 · 조건 정리 보기</summary><p>① 권수비 200/1000=0.2</p></details><details class=\"step\"><summary>2단계 · 공식 적용 보기</summary><p>② 2차 전압 220×0.2</p></details><details class=\"step\"><summary>3단계 · 정답과 검산 보기</summary><p>③ 44V</p></details><h3>④ 시험에서 조심할 점</h3><div class=\"note\">실제 변압기에는 철손·동손 등이 존재하므로 효율이 100%가 아닙니다.</div><button class=\"btn secondary\" onclick=\"startQuiz('lesson',16)\">16회차 연습문제 풀기 →</button></div>";
DEEP[17]="<div class=\"deep\"><h2>📚 17회차 교재형 심화 · 전동기와 발전기</h2><span class=\"tag\">Motor and Generator</span><h3>① 원리부터 이해하기</h3><p>전동기는 전기에너지를 기계에너지로, 발전기는 기계에너지를 전기에너지로 바꿉니다.</p><div class=\"diagram\"><svg viewBox=\"0 0 340 115\" role=\"img\" aria-label=\"전동기와 발전기 개념과 공식 흐름도\"><rect x=\"7\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#87c9ff\"/><rect x=\"121\" y=\"17\" width=\"98\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#f7c65d\"/><rect x=\"236\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#6ee7b7\"/><path d=\"M105 57 H119 M219 57 H235\" stroke=\"#f7c65d\" stroke-width=\"3\"/><text x=\"55\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">원리</text><text x=\"55\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">이해</text><text x=\"170\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">공식</text><text x=\"170\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">선택</text><text x=\"285\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">대입</text><text x=\"285\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">검산</text></svg></div><h3>② 꼭 기억할 공식</h3><div class=\"formula formula-small\">η=출력/입력×100%</div><h3>③ 실제 계산·판단 예제</h3><p><b>문제 상황:</b> 전동기 입력 2000W, 출력 1600W</p><details class=\"step\"><summary>1단계 · 조건 정리 보기</summary><p>① 입력과 출력 구분</p></details><details class=\"step\"><summary>2단계 · 공식 적용 보기</summary><p>② 1600÷2000=0.8</p></details><details class=\"step\"><summary>3단계 · 정답과 검산 보기</summary><p>③ 효율 80%</p></details><h3>④ 시험에서 조심할 점</h3><div class=\"note\">효율은 0~100% 범위이며 손실이 있으면 100%보다 작습니다.</div><button class=\"btn secondary\" onclick=\"startQuiz('lesson',17)\">17회차 연습문제 풀기 →</button></div>";
DEEP[18]="<div class=\"deep\"><h2>📚 18회차 교재형 심화 · 유도전동기 슬립</h2><span class=\"tag\">Induction Motor Slip</span><h3>① 원리부터 이해하기</h3><p>슬립은 동기속도와 회전자속도의 차이를 동기속도로 나눈 값입니다.</p><div class=\"diagram\"><svg viewBox=\"0 0 340 115\" role=\"img\" aria-label=\"유도전동기 슬립 개념과 공식 흐름도\"><rect x=\"7\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#87c9ff\"/><rect x=\"121\" y=\"17\" width=\"98\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#f7c65d\"/><rect x=\"236\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#6ee7b7\"/><path d=\"M105 57 H119 M219 57 H235\" stroke=\"#f7c65d\" stroke-width=\"3\"/><text x=\"55\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">원리</text><text x=\"55\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">이해</text><text x=\"170\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">공식</text><text x=\"170\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">선택</text><text x=\"285\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">대입</text><text x=\"285\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">검산</text></svg></div><h3>② 꼭 기억할 공식</h3><div class=\"formula formula-small\">s=(Nₛ−N)/Nₛ</div><h3>③ 실제 계산·판단 예제</h3><p><b>문제 상황:</b> 동기속도 1800rpm, 실제속도 1710rpm</p><details class=\"step\"><summary>1단계 · 조건 정리 보기</summary><p>① 속도차 1800−1710=90</p></details><details class=\"step\"><summary>2단계 · 공식 적용 보기</summary><p>② 90/1800=0.05</p></details><details class=\"step\"><summary>3단계 · 정답과 검산 보기</summary><p>③ 슬립 5%</p></details><h3>④ 시험에서 조심할 점</h3><div class=\"note\">정상 전동 운전에서는 회전자 속도가 동기속도보다 조금 낮습니다.</div><button class=\"btn secondary\" onclick=\"startQuiz('lesson',18)\">18회차 연습문제 풀기 →</button></div>";
DEEP[19]="<div class=\"deep\"><h2>📚 19회차 교재형 심화 · 3상 전력</h2><span class=\"tag\">Three-phase Power</span><h3>① 원리부터 이해하기</h3><p>평형 3상 교류의 유효전력은 선간전압·선전류·역률로 계산합니다.</p><div class=\"diagram\"><svg viewBox=\"0 0 340 115\" role=\"img\" aria-label=\"3상 전력 개념과 공식 흐름도\"><rect x=\"7\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#87c9ff\"/><rect x=\"121\" y=\"17\" width=\"98\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#f7c65d\"/><rect x=\"236\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#6ee7b7\"/><path d=\"M105 57 H119 M219 57 H235\" stroke=\"#f7c65d\" stroke-width=\"3\"/><text x=\"55\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">원리</text><text x=\"55\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">이해</text><text x=\"170\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">공식</text><text x=\"170\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">선택</text><text x=\"285\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">대입</text><text x=\"285\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">검산</text></svg></div><h3>② 꼭 기억할 공식</h3><div class=\"formula formula-small\">P=√3 V_L I_L cosφ</div><h3>③ 실제 계산·판단 예제</h3><p><b>문제 상황:</b> 선간전압 400V, 선전류 10A, 역률 1</p><details class=\"step\"><summary>1단계 · 조건 정리 보기</summary><p>① √3≈1.732</p></details><details class=\"step\"><summary>2단계 · 공식 적용 보기</summary><p>② 1.732×400×10</p></details><details class=\"step\"><summary>3단계 · 정답과 검산 보기</summary><p>③ 약 6928W=6.93kW</p></details><h3>④ 시험에서 조심할 점</h3><div class=\"note\">단상 P=VIcosφ와 평형 3상 P=√3VIcosφ를 구분하세요.</div><button class=\"btn secondary\" onclick=\"startQuiz('lesson',19)\">19회차 연습문제 풀기 →</button></div>";
DEEP[20]="<div class=\"deep\"><h2>📚 20회차 교재형 심화 · 송전 손실</h2><span class=\"tag\">Transmission Loss</span><h3>① 원리부터 이해하기</h3><p>도선에서 발생하는 저항 손실은 전류의 제곱에 비례합니다.</p><div class=\"diagram\"><svg viewBox=\"0 0 340 115\" role=\"img\" aria-label=\"송전 손실 개념과 공식 흐름도\"><rect x=\"7\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#87c9ff\"/><rect x=\"121\" y=\"17\" width=\"98\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#f7c65d\"/><rect x=\"236\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#6ee7b7\"/><path d=\"M105 57 H119 M219 57 H235\" stroke=\"#f7c65d\" stroke-width=\"3\"/><text x=\"55\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">원리</text><text x=\"55\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">이해</text><text x=\"170\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">공식</text><text x=\"170\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">선택</text><text x=\"285\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">대입</text><text x=\"285\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">검산</text></svg></div><h3>② 꼭 기억할 공식</h3><div class=\"formula formula-small\">P손실=I²R</div><h3>③ 실제 계산·판단 예제</h3><p><b>문제 상황:</b> 도선저항 2Ω, 전류 10A</p><details class=\"step\"><summary>1단계 · 조건 정리 보기</summary><p>① I²=100</p></details><details class=\"step\"><summary>2단계 · 공식 적용 보기</summary><p>② 100×2=200W</p></details><details class=\"step\"><summary>3단계 · 정답과 검산 보기</summary><p>③ 전류 5A면 25×2=50W</p></details><h3>④ 시험에서 조심할 점</h3><div class=\"note\">같은 전력을 더 높은 전압으로 송전하면 전류를 줄여 손실을 낮출 수 있습니다.</div><button class=\"btn secondary\" onclick=\"startQuiz('lesson',20)\">20회차 연습문제 풀기 →</button></div>";
DEEP[21]="<div class=\"deep\"><h2>📚 21회차 교재형 심화 · 보호계전기</h2><span class=\"tag\">Protective Relay</span><h3>① 원리부터 이해하기</h3><p>보호계전기는 전류·전압 등 이상 상태를 감지해 차단기에 동작 신호를 보냅니다.</p><div class=\"diagram\"><svg viewBox=\"0 0 340 115\" role=\"img\" aria-label=\"보호계전기 개념과 공식 흐름도\"><rect x=\"7\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#87c9ff\"/><rect x=\"121\" y=\"17\" width=\"98\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#f7c65d\"/><rect x=\"236\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#6ee7b7\"/><path d=\"M105 57 H119 M219 57 H235\" stroke=\"#f7c65d\" stroke-width=\"3\"/><text x=\"55\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">원리</text><text x=\"55\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">이해</text><text x=\"170\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">공식</text><text x=\"170\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">선택</text><text x=\"285\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">대입</text><text x=\"285\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">검산</text></svg></div><h3>② 꼭 기억할 공식</h3><div class=\"formula formula-small\">감지 → 판단 → 차단기 동작</div><h3>③ 실제 계산·판단 예제</h3><p><b>문제 상황:</b> 회로에 단락 고장 발생</p><details class=\"step\"><summary>1단계 · 조건 정리 보기</summary><p>① 과전류가 발생</p></details><details class=\"step\"><summary>2단계 · 공식 적용 보기</summary><p>② 계전기가 설정조건에 따라 판단</p></details><details class=\"step\"><summary>3단계 · 정답과 검산 보기</summary><p>③ 차단기가 고장 회로를 분리</p></details><h3>④ 시험에서 조심할 점</h3><div class=\"note\">계전기와 차단기는 같은 장치가 아닙니다. 실제 보호협조에는 시간·전류 설정이 필요합니다.</div><button class=\"btn secondary\" onclick=\"startQuiz('lesson',21)\">21회차 연습문제 풀기 →</button></div>";
DEEP[22]="<div class=\"deep\"><h2>📚 22회차 교재형 심화 · 접지와 보호도체</h2><span class=\"tag\">Earthing and PE</span><h3>① 원리부터 이해하기</h3><p>접지와 보호도체는 고장 시 접촉전압과 감전 위험을 낮추는 보호체계의 일부입니다.</p><div class=\"diagram\"><svg viewBox=\"0 0 340 115\" role=\"img\" aria-label=\"접지와 보호도체 개념과 공식 흐름도\"><rect x=\"7\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#87c9ff\"/><rect x=\"121\" y=\"17\" width=\"98\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#f7c65d\"/><rect x=\"236\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#6ee7b7\"/><path d=\"M105 57 H119 M219 57 H235\" stroke=\"#f7c65d\" stroke-width=\"3\"/><text x=\"55\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">원리</text><text x=\"55\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">이해</text><text x=\"170\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">공식</text><text x=\"170\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">선택</text><text x=\"285\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">대입</text><text x=\"285\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">검산</text></svg></div><h3>② 꼭 기억할 공식</h3><div class=\"formula formula-small\">보호도체 PE ≠ 중성선 N</div><h3>③ 실제 계산·판단 예제</h3><p><b>문제 상황:</b> 기기 외함에 절연 고장으로 전압이 걸린 상황</p><details class=\"step\"><summary>1단계 · 조건 정리 보기</summary><p>① 위험한 외함 접촉 가능</p></details><details class=\"step\"><summary>2단계 · 공식 적용 보기</summary><p>② 적절한 보호도체와 보호장치가 고장전류 경로·차단에 기여</p></details><details class=\"step\"><summary>3단계 · 정답과 검산 보기</summary><p>③ 차단시간과 접지방식 등을 함께 검토</p></details><h3>④ 시험에서 조심할 점</h3><div class=\"note\">임의 접지나 배선 연결은 위험합니다. 최신 KEC와 자격 있는 전문가의 검토가 필요합니다.</div><button class=\"btn secondary\" onclick=\"startQuiz('lesson',22)\">22회차 연습문제 풀기 →</button></div>";
DEEP[23]="<div class=\"deep\"><h2>📚 23회차 교재형 심화 · 과전류 보호</h2><span class=\"tag\">Overcurrent Protection</span><h3>① 원리부터 이해하기</h3><p>과부하와 단락은 모두 과전류의 원인이지만 발생 조건과 보호 방법이 다릅니다.</p><div class=\"diagram\"><svg viewBox=\"0 0 340 115\" role=\"img\" aria-label=\"과전류 보호 개념과 공식 흐름도\"><rect x=\"7\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#87c9ff\"/><rect x=\"121\" y=\"17\" width=\"98\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#f7c65d\"/><rect x=\"236\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#6ee7b7\"/><path d=\"M105 57 H119 M219 57 H235\" stroke=\"#f7c65d\" stroke-width=\"3\"/><text x=\"55\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">원리</text><text x=\"55\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">이해</text><text x=\"170\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">공식</text><text x=\"170\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">선택</text><text x=\"285\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">대입</text><text x=\"285\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">검산</text></svg></div><h3>② 꼭 기억할 공식</h3><div class=\"formula formula-small\">과부하 ≠ 단락</div><h3>③ 실제 계산·판단 예제</h3><p><b>문제 상황:</b> 모터가 정격보다 큰 부하로 오래 운전</p><details class=\"step\"><summary>1단계 · 조건 정리 보기</summary><p>① 정격 초과 전류 지속</p></details><details class=\"step\"><summary>2단계 · 공식 적용 보기</summary><p>② 도체·기기 과열 위험</p></details><details class=\"step\"><summary>3단계 · 정답과 검산 보기</summary><p>③ 적절한 보호장치 선정 및 보호협조 필요</p></details><h3>④ 시험에서 조심할 점</h3><div class=\"note\">차단기 정격을 임의로 올리면 화재 위험이 커질 수 있습니다.</div><button class=\"btn secondary\" onclick=\"startQuiz('lesson',23)\">23회차 연습문제 풀기 →</button></div>";
DEEP[24]="<div class=\"deep\"><h2>📚 24회차 교재형 심화 · 한국전기설비규정</h2><span class=\"tag\">Korean Electrical Code</span><h3>① 원리부터 이해하기</h3><p>KEC는 전기설비 안전 확보를 위한 국내 규정 체계입니다. 수치·조항은 개정될 수 있습니다.</p><div class=\"diagram\"><svg viewBox=\"0 0 340 115\" role=\"img\" aria-label=\"한국전기설비규정 개념과 공식 흐름도\"><rect x=\"7\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#87c9ff\"/><rect x=\"121\" y=\"17\" width=\"98\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#f7c65d\"/><rect x=\"236\" y=\"17\" width=\"97\" height=\"80\" rx=\"13\" fill=\"#243e60\" stroke=\"#6ee7b7\"/><path d=\"M105 57 H119 M219 57 H235\" stroke=\"#f7c65d\" stroke-width=\"3\"/><text x=\"55\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">원리</text><text x=\"55\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">이해</text><text x=\"170\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">공식</text><text x=\"170\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">선택</text><text x=\"285\" y=\"49\" text-anchor=\"middle\" fill=\"white\" font-size=\"13\">대입</text><text x=\"285\" y=\"69\" text-anchor=\"middle\" fill=\"#a9c3e6\" font-size=\"12\">검산</text></svg></div><h3>② 꼭 기억할 공식</h3><div class=\"formula formula-small\">규정 확인 → 적용범위 확인 → 설계 검토</div><h3>③ 실제 계산·판단 예제</h3><p><b>문제 상황:</b> 특정 전기설비의 접지·보호 요구사항을 확인해야 하는 상황</p><details class=\"step\"><summary>1단계 · 조건 정리 보기</summary><p>① 설비 종류와 조건 확인</p></details><details class=\"step\"><summary>2단계 · 공식 적용 보기</summary><p>② 시험 연도 기준의 KEC 원문 확인</p></details><details class=\"step\"><summary>3단계 · 정답과 검산 보기</summary><p>③ 해당 조항의 적용범위와 예외 검토</p></details><h3>④ 시험에서 조심할 점</h3><div class=\"note\">이 앱은 규정의 모든 최신 수치를 보장하지 않습니다. 실무는 공식 원문과 전문 검토를 우선하세요.</div><button class=\"btn secondary\" onclick=\"startQuiz('lesson',24)\">24회차 연습문제 풀기 →</button></div>";
QS.push(...[{"id": 210, "lesson": 10, "q": "12V에 2Ω과 4Ω을 직렬 연결했을 때 전류는?", "opts": ["2A", "3A", "6A", "8A"], "a": 0, "why": "합성저항 6Ω이므로 12/6=2A."}, {"id": 211, "lesson": 11, "q": "유입 5A, 2A / 유출 4A일 때 나머지 유출전류는?", "opts": ["1A", "3A", "7A", "11A"], "a": 1, "why": "KCL: 5+2=4+I이므로 I=3A."}, {"id": 212, "lesson": 12, "q": "정현파 최대 전압 141.4V의 실효값은?", "opts": ["70.7V", "100V", "141.4V", "200V"], "a": 1, "why": "141.4/√2≈100V."}, {"id": 213, "lesson": 13, "q": "전하 사이 거리가 2배면 힘은?", "opts": ["2배", "4배", "1/2", "1/4"], "a": 3, "why": "쿨롱 힘은 거리의 제곱에 반비례합니다."}, {"id": 214, "lesson": 14, "q": "2C 전하를 옮기는 데 10J가 필요할 때 전위차는?", "opts": ["2V", "5V", "10V", "20V"], "a": 1, "why": "V=W/q=10/2=5V."}, {"id": 215, "lesson": 15, "q": "100회 코일의 선속이 0.03Wb만큼 0.5초에 변하면 유도기전력 크기는?", "opts": ["3V", "6V", "15V", "60V"], "a": 1, "why": "100×0.03/0.5=6V."}, {"id": 216, "lesson": 16, "q": "1차 220V, 권수비 N₂/N₁=0.2일 때 이상적인 2차 전압은?", "opts": ["22V", "44V", "110V", "440V"], "a": 1, "why": "V₂=220×0.2=44V."}, {"id": 217, "lesson": 17, "q": "입력 2000W, 출력 1600W의 효율은?", "opts": ["60%", "70%", "80%", "90%"], "a": 2, "why": "1600/2000×100=80%."}, {"id": 218, "lesson": 18, "q": "동기속도 1800rpm, 회전자속도 1710rpm이면 슬립은?", "opts": ["2%", "5%", "10%", "20%"], "a": 1, "why": "90/1800=0.05=5%."}, {"id": 219, "lesson": 19, "q": "평형 3상 400V, 10A, 역률 1일 때 유효전력은 약?", "opts": ["4kW", "5.66kW", "6.93kW", "12kW"], "a": 2, "why": "√3×400×10≈6928W."}, {"id": 220, "lesson": 20, "q": "저항 2Ω, 전류 10A일 때 저항손실은?", "opts": ["20W", "50W", "100W", "200W"], "a": 3, "why": "I²R=10²×2=200W."}, {"id": 221, "lesson": 21, "q": "보호계전기의 주된 역할은?", "opts": ["전압 저장", "이상 상태 검출·차단 신호", "교류를 직류로 변환", "전력을 생산"], "a": 1, "why": "계전기는 이상을 감지하고 차단기 동작을 지시합니다."}, {"id": 222, "lesson": 22, "q": "보호도체(PE)의 주된 목적은?", "opts": ["통상 부하전류 운반", "고장 시 감전 보호", "주파수 변경", "전압 승압"], "a": 1, "why": "PE는 고장 시 감전 보호를 위한 도체입니다."}, {"id": 223, "lesson": 23, "q": "과부하와 단락에 대한 설명으로 옳은 것은?", "opts": ["같은 현상이다", "모두 과전류를 일으킬 수 있다", "차단기는 필요 없다", "접지는 모든 과전류를 제거한다"], "a": 1, "why": "과부하와 단락은 원인은 다르지만 과전류를 일으킬 수 있습니다."}, {"id": 224, "lesson": 24, "q": "KEC 관련 문제를 풀 때 가장 적절한 태도는?", "opts": ["오래된 암기표만 신뢰", "설비 조건과 최신 규정 확인", "모든 시설에 같은 수치 적용", "보호장치 생략"], "a": 1, "why": "적용 조건과 최신 규정을 함께 확인해야 합니다."}] );

DEEP[25]="<div class=\"deep\"><h2>📚 25회차 심화 · 커패시터와 정전용량</h2><span class=\"tag\">Capacitance</span><h3>① 개념 이해</h3><p>커패시터는 전하를 저장하며 전압이 높을수록 저장 전하량이 증가합니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">Q=C×V</div><h3>③ 계산 예제</h3><p>C=2F, V=3V이면 Q=6C.</p><h3>④ 확인할 점</h3><p>Q=CV=2×3=6C.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[26]="<div class=\"deep\"><h2>📚 26회차 심화 · 인덕터와 자기 에너지</h2><span class=\"tag\">Inductance</span><h3>① 개념 이해</h3><p>인덕터는 전류 변화에 저항하며 자기장에 에너지를 저장합니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">W=½LI²</div><h3>③ 계산 예제</h3><p>L=2H, I=3A이면 W=9J.</p><h3>④ 확인할 점</h3><p>W=0.5×2×3²=9J.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[27]="<div class=\"deep\"><h2>📚 27회차 심화 · RC 시정수</h2><span class=\"tag\">RC Time Constant</span><h3>① 개념 이해</h3><p>저항과 커패시터가 만드는 과도현상의 시간 척도입니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">τ=RC</div><h3>③ 계산 예제</h3><p>R=2kΩ, C=100μF이면 τ=0.2s.</p><h3>④ 확인할 점</h3><p>2000×0.0001=0.2s.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[28]="<div class=\"deep\"><h2>📚 28회차 심화 · 교류 임피던스</h2><span class=\"tag\">Impedance</span><h3>① 개념 이해</h3><p>교류에서는 저항과 리액턴스를 함께 고려하며 단위는 옴입니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">|Z|=√(R²+X²)</div><h3>③ 계산 예제</h3><p>R=3Ω, X=4Ω이면 |Z|=5Ω.</p><h3>④ 확인할 점</h3><p>피타고라스 관계 √(9+16)=5Ω.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[29]="<div class=\"deep\"><h2>📚 29회차 심화 · 역률과 유효전력</h2><span class=\"tag\">Power Factor</span><h3>① 개념 이해</h3><p>역률은 피상전력 중 유효전력이 차지하는 비율입니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">P=S×cosφ</div><h3>③ 계산 예제</h3><p>S=1000VA, 역률 0.8이면 P=800W.</p><h3>④ 확인할 점</h3><p>P=1000×0.8=800W.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[30]="<div class=\"deep\"><h2>📚 30회차 심화 · 라플라스 변환 입문</h2><span class=\"tag\">Laplace Transform</span><h3>① 개념 이해</h3><p>시간에 따른 미분방정식을 s영역의 대수식으로 바꾸어 회로와 제어계를 분석합니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">L{1}=1/s (s&gt;0)</div><h3>③ 계산 예제</h3><p>상수 입력 1의 라플라스 변환은 1/s입니다.</p><h3>④ 확인할 점</h3><p>정의에 따라 ∫₀∞e^(-st)dt=1/s입니다.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[31]="<div class=\"deep\"><h2>📚 31회차 심화 · 제어계 피드백</h2><span class=\"tag\">Feedback Control</span><h3>① 개념 이해</h3><p>음의 피드백은 목표와 출력의 차이를 이용해 오차를 줄이는 제어 방식입니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">e(t)=r(t)−y(t)</div><h3>③ 계산 예제</h3><p>목표 10, 출력 8이면 오차는 2입니다.</p><h3>④ 확인할 점</h3><p>e=r−y=10−8=2.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[32]="<div class=\"deep\"><h2>📚 32회차 심화 · 전속밀도와 전계</h2><span class=\"tag\">Electric Flux Density</span><h3>① 개념 이해</h3><p>선형 등방성 매질에서는 전속밀도 D가 전계 E와 유전율 ε에 비례합니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">D=εE</div><h3>③ 계산 예제</h3><p>ε=2 (가상 단위계), E=3이면 D=6입니다.</p><h3>④ 확인할 점</h3><p>D=εE이므로 비례합니다.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[33]="<div class=\"deep\"><h2>📚 33회차 심화 · 평행판 커패시터</h2><span class=\"tag\">Parallel-plate Capacitor</span><h3>① 개념 이해</h3><p>가장자리 효과를 무시하면 정전용량은 판 면적에 비례하고 간격에 반비례합니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">C=εA/d</div><h3>③ 계산 예제</h3><p>면적이 2배가 되고 간격이 같으면 C는 2배입니다.</p><h3>④ 확인할 점</h3><p>C=εA/d이므로 간격에 반비례합니다.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[34]="<div class=\"deep\"><h2>📚 34회차 심화 · 자속과 자속밀도</h2><span class=\"tag\">Magnetic Flux</span><h3>① 개념 이해</h3><p>균일한 자속밀도가 면에 수직이면 자기선속은 B와 면적 A의 곱입니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">Φ=B×A</div><h3>③ 계산 예제</h3><p>B=2T, A=0.5m²이면 Φ=1Wb.</p><h3>④ 확인할 점</h3><p>Φ=BA=2×0.5=1Wb.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[35]="<div class=\"deep\"><h2>📚 35회차 심화 · 자기력과 로렌츠 힘</h2><span class=\"tag\">Lorentz Force</span><h3>① 개념 이해</h3><p>자기장 속을 움직이는 전하는 속도와 자기장에 수직인 방향의 힘을 받습니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">F=|q|vBsinθ</div><h3>③ 계산 예제</h3><p>수직(θ=90°)일 때 sinθ=1로 힘이 최대입니다.</p><h3>④ 확인할 점</h3><p>sin0°=0이므로 자기력은 0입니다.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[36]="<div class=\"deep\"><h2>📚 36회차 심화 · 가우스 법칙 입문</h2><span class=\"tag\">Gauss Law</span><h3>① 개념 이해</h3><p>닫힌 면을 지나는 총 전속은 내부 자유전하량과 같습니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">∮D·dA=Q내부</div><h3>③ 계산 예제</h3><p>닫힌 면 내부 전하가 0이면 총 전속은 0입니다.</p><h3>④ 확인할 점</h3><p>가우스 법칙에서 총 전속은 내부 순전하량과 같습니다.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[37]="<div class=\"deep\"><h2>📚 37회차 심화 · 직류전동기 역기전력</h2><span class=\"tag\">Back EMF</span><h3>① 개념 이해</h3><p>직류전동기 회전 시 발생하는 역기전력은 인가전압에 반대 방향으로 작용합니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">V=E+IaRa</div><h3>③ 계산 예제</h3><p>V=100V, IaRa=10V이면 E=90V.</p><h3>④ 확인할 점</h3><p>E=V−IaRa=90V.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[38]="<div class=\"deep\"><h2>📚 38회차 심화 · 변압기 효율</h2><span class=\"tag\">Transformer Efficiency</span><h3>① 개념 이해</h3><p>효율은 입력전력에 대한 출력전력의 비입니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">η=Pout/Pin×100%</div><h3>③ 계산 예제</h3><p>입력 1000W, 출력 900W이면 효율 90%.</p><h3>④ 확인할 점</h3><p>900/1000×100=90%.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[39]="<div class=\"deep\"><h2>📚 39회차 심화 · 동기속도와 극수</h2><span class=\"tag\">Synchronous Speed</span><h3>① 개념 이해</h3><p>교류기 동기속도는 주파수에 비례하고 극수에 반비례합니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">Ns=120f/P</div><h3>③ 계산 예제</h3><p>60Hz, 4극이면 Ns=1800rpm.</p><h3>④ 확인할 점</h3><p>120×60/4=1800rpm.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[40]="<div class=\"deep\"><h2>📚 40회차 심화 · 유도전동기 회전자 주파수</h2><span class=\"tag\">Rotor Frequency</span><h3>① 개념 이해</h3><p>유도전동기 회전자 전류 주파수는 전원 주파수와 슬립의 곱입니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">f₂=s f₁</div><h3>③ 계산 예제</h3><p>60Hz, 슬립 0.05이면 f₂=3Hz.</p><h3>④ 확인할 점</h3><p>f₂=0.05×60=3Hz.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[41]="<div class=\"deep\"><h2>📚 41회차 심화 · 전동기 출력과 토크</h2><span class=\"tag\">Motor Torque</span><h3>① 개념 이해</h3><p>회전기계의 기계적 출력은 각속도와 토크의 곱입니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">P=Tω</div><h3>③ 계산 예제</h3><p>T=10N·m, ω=20rad/s이면 P=200W.</p><h3>④ 확인할 점</h3><p>P=10×20=200W.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[42]="<div class=\"deep\"><h2>📚 42회차 심화 · 단상과 3상 전력</h2><span class=\"tag\">Single/Three Phase</span><h3>① 개념 이해</h3><p>평형 3상 유효전력은 선간전압·선전류·역률로 계산합니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">P=√3 V_L I_L cosφ</div><h3>③ 계산 예제</h3><p>선간전압과 선전류가 같아도 단상과 3상 식은 다릅니다.</p><h3>④ 확인할 점</h3><p>평형 3상은 √3×선간전압×선전류×역률입니다.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[43]="<div class=\"deep\"><h2>📚 43회차 심화 · 전압강하 기초</h2><span class=\"tag\">Voltage Drop</span><h3>① 개념 이해</h3><p>전류가 도체 저항을 지나면 전압이 감소하며 저항성 직류 회로에서는 ΔV=IR입니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">ΔV=IR</div><h3>③ 계산 예제</h3><p>I=10A, R=0.2Ω이면 전압강하 2V.</p><h3>④ 확인할 점</h3><p>ΔV=10×0.2=2V.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[44]="<div class=\"deep\"><h2>📚 44회차 심화 · 역률 개선의 의미</h2><span class=\"tag\">Power Factor Correction</span><h3>① 개념 이해</h3><p>유효전력이 일정할 때 역률이 높아지면 같은 전압에서 필요한 전류를 줄일 수 있습니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">단상 I=P/(Vcosφ)</div><h3>③ 계산 예제</h3><p>P,V가 일정할 때 역률 0.5에서 1로 높이면 전류는 절반입니다.</p><h3>④ 확인할 점</h3><p>I=P/(Vcosφ)이므로 역률이 2배면 전류는 절반.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[45]="<div class=\"deep\"><h2>📚 45회차 심화 · 단락과 고장전류</h2><span class=\"tag\">Short Circuit</span><h3>① 개념 이해</h3><p>단락은 낮은 임피던스 경로로 큰 전류가 흐르는 고장입니다. 실제 고장전류는 계통 임피던스에 좌우됩니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">I≈V/Z (단순 모델)</div><h3>③ 계산 예제</h3><p>전압이 같고 등가 임피던스가 절반이면 고장전류는 약 2배입니다.</p><h3>④ 확인할 점</h3><p>I≈V/Z이므로 반비례합니다.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[46]="<div class=\"deep\"><h2>📚 46회차 심화 · 변전설비 기본 구성</h2><span class=\"tag\">Substation</span><h3>① 개념 이해</h3><p>변전설비는 변압기·차단기·개폐기·보호계전기 등으로 전압 변환과 고장 보호를 수행합니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">변압기: 전압 변환 / 차단기: 고장전류 차단</div><h3>③ 계산 예제</h3><p>변압기와 차단기는 목적이 다릅니다.</p><h3>④ 확인할 점</h3><p>차단기는 고장전류를 차단하는 역할을 합니다.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[47]="<div class=\"deep\"><h2>📚 47회차 심화 · 감전 보호의 기본</h2><span class=\"tag\">Electric Shock Protection</span><h3>① 개념 이해</h3><p>기본보호는 충전부 접촉을 막고, 고장보호는 절연 고장 시 위험을 줄입니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">기본보호 + 고장보호</div><h3>③ 계산 예제</h3><p>절연, 외함, 보호접지 및 적절한 자동전원차단을 함께 검토합니다.</p><h3>④ 확인할 점</h3><p>고장 시 위험한 접촉전압과 감전 위험을 낮추기 위한 보호수단입니다.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[48]="<div class=\"deep\"><h2>📚 48회차 심화 · 누전차단기와 과전류차단기</h2><span class=\"tag\">RCD and OCPD</span><h3>① 개념 이해</h3><p>누전차단기(RCD)는 잔류전류를 검출하고, 과전류차단기는 과부하·단락에 대응합니다. 기기 종류에 따라 기능이 결합될 수 있습니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">RCD: 잔류전류 / OCPD: 과전류</div><h3>③ 계산 예제</h3><p>일반 RCD가 모든 과부하를 보호한다고 가정하면 안 됩니다.</p><h3>④ 확인할 점</h3><p>RCD는 회로의 잔류전류를 검출합니다.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[49]="<div class=\"deep\"><h2>📚 49회차 심화 · 전선 허용전류</h2><span class=\"tag\">Cable Ampacity</span><h3>① 개념 이해</h3><p>허용전류는 도체 크기 외에도 포설방법, 주위온도, 집합포설 등의 조건에 따라 달라집니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">허용전류 ≥ 설계전류 (기본 검토)</div><h3>③ 계산 예제</h3><p>전선 굵기만으로 허용전류를 단정하지 않습니다.</p><h3>④ 확인할 점</h3><p>포설방법과 주위온도 등 보정조건을 확인해야 합니다.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";
DEEP[50]="<div class=\"deep\"><h2>📚 50회차 심화 · 접지계통의 구분</h2><span class=\"tag\">Earthing Systems</span><h3>① 개념 이해</h3><p>TN, TT, IT 등 접지계통은 전원 접지와 노출도전부 접지 방식에 따라 구분됩니다.</p><h3>② 핵심 공식</h3><div class=\"formula\">TN / TT / IT</div><h3>③ 계산 예제</h3><p>접지계통에 따라 고장보호 조건이 달라집니다.</p><h3>④ 확인할 점</h3><p>전원과 설비의 접지 방식을 분류한 것입니다.</p><p class=\"muted small\">기초 학습용 예시이며 실제 설비 설계·작업에는 최신 KEC와 자격자 검토가 필요합니다.</p></div>";

const V9_ROWS=[{"id":9001,"lesson":4,"level":"쉬움","q":"전하량의 SI 단위는?","opts":["C","A","V","T"],"a":0,"why":"전하량은 전기의 양을 뜻합니다. → 전하량의 SI 단위는 쿨롱입니다. → 기호는 C입니다.","steps":["전하량은 전기의 양을 뜻합니다.","전하량의 SI 단위는 쿨롱입니다.","기호는 C입니다."]},{"id":9002,"lesson":4,"level":"쉬움","q":"전계의 세기를 나타내는 단위로 적절한 것은?","opts":["W","V/m","Ω","Hz"],"a":1,"why":"전계는 단위 전하에 작용하는 힘과 관련됩니다. → 전위차의 공간적 변화로도 표현합니다. → V/m가 전계 단위입니다.","steps":["전계는 단위 전하에 작용하는 힘과 관련됩니다.","전위차의 공간적 변화로도 표현합니다.","V/m가 전계 단위입니다."]},{"id":9003,"lesson":4,"level":"쉬움","q":"자속의 SI 단위는?","opts":["T","H","Wb","F"],"a":2,"why":"자속은 자기장이 면을 통과하는 양입니다. → 자속은 Φ로 나타냅니다. → 단위는 웨버(Wb)입니다.","steps":["자속은 자기장이 면을 통과하는 양입니다.","자속은 Φ로 나타냅니다.","단위는 웨버(Wb)입니다."]},{"id":9004,"lesson":4,"level":"보통","q":"균일한 전계 100V/m에 2C 전하가 놓일 때 전기력 크기는?","opts":["50N","100N","200N","400N"],"a":2,"why":"F=qE를 적용합니다. → q=2C, E=100N/C입니다. → F=2×100=200N입니다.","steps":["F=qE를 적용합니다.","q=2C, E=100N/C입니다.","F=2×100=200N입니다."]},{"id":9005,"lesson":4,"level":"보통","q":"전압 20V가 0.5m 간격에 균일하게 걸리면 전계 크기는?","opts":["10V/m","20V/m","40V/m","100V/m"],"a":2,"why":"균일 전계에서 E=V/d입니다. → 20÷0.5를 계산합니다. → E=40V/m입니다.","steps":["균일 전계에서 E=V/d입니다.","20÷0.5를 계산합니다.","E=40V/m입니다."]},{"id":9006,"lesson":4,"level":"보통","q":"자속 0.02Wb가 면적 0.01m²에 수직으로 균일하게 지나면 자속밀도는?","opts":["0.2T","1T","2T","20T"],"a":2,"why":"B=Φ/A를 적용합니다. → 0.02÷0.01을 계산합니다. → B=2T입니다.","steps":["B=Φ/A를 적용합니다.","0.02÷0.01을 계산합니다.","B=2T입니다."]},{"id":9007,"lesson":4,"level":"어려움","q":"1회 권선의 자속이 0.3Wb에서 0.1Wb로 0.1초 동안 변할 때 평균 유도기전력 크기는?","opts":["0.2V","1V","2V","4V"],"a":2,"why":"패러데이 법칙의 크기 |e|=N|ΔΦ|/Δt입니다. → 자속 변화 크기는 0.2Wb입니다. → 0.2÷0.1=2V입니다.","steps":["패러데이 법칙의 크기 |e|=N|ΔΦ|/Δt입니다.","자속 변화 크기는 0.2Wb입니다.","0.2÷0.1=2V입니다."]},{"id":9008,"lesson":4,"level":"어려움","q":"10회 권선에서 각 권선의 자속이 0.05Wb만큼 0.5초 동안 변하면 평균 유도기전력 크기는?","opts":["0.1V","0.5V","1V","10V"],"a":2,"why":"|e|=N|ΔΦ|/Δt입니다. → 10×0.05÷0.5를 계산합니다. → 1V입니다.","steps":["|e|=N|ΔΦ|/Δt입니다.","10×0.05÷0.5를 계산합니다.","1V입니다."]},{"id":9009,"lesson":4,"level":"어려움","q":"자속밀도 0.5T인 균일한 자기장에 수직으로 길이 2m 도선이 놓이고 전류 3A가 흐를 때 힘의 크기는?","opts":["1N","2N","3N","6N"],"a":2,"why":"자기장에 수직인 도선의 힘 F=BIL입니다. → 0.5×3×2를 계산합니다. → F=3N입니다.","steps":["자기장에 수직인 도선의 힘 F=BIL입니다.","0.5×3×2를 계산합니다.","F=3N입니다."]},{"id":9010,"lesson":5,"level":"쉬움","q":"변압기가 주로 이용하는 현상은?","opts":["정전유도","전자유도","광전효과","열전효과"],"a":1,"why":"변압기는 교류 자속 변화를 이용합니다. → 자속 변화가 권선에 전압을 유도합니다. → 전자유도가 정답입니다.","steps":["변압기는 교류 자속 변화를 이용합니다.","자속 변화가 권선에 전압을 유도합니다.","전자유도가 정답입니다."]},{"id":9011,"lesson":5,"level":"쉬움","q":"전동기가 변환하는 에너지는?","opts":["기계→전기","전기→기계","빛→열","화학→빛"],"a":1,"why":"전동기는 전기를 공급받습니다. → 축을 회전시키는 기계적 출력을 냅니다. → 전기→기계입니다.","steps":["전동기는 전기를 공급받습니다.","축을 회전시키는 기계적 출력을 냅니다.","전기→기계입니다."]},{"id":9012,"lesson":5,"level":"쉬움","q":"이상 변압기에서 1차·2차 권수비가 2:1이면 전압비 V1:V2는?","opts":["1:2","2:1","1:1","4:1"],"a":1,"why":"이상 변압기는 전압비=권수비입니다. → N1:N2=2:1입니다. → V1:V2=2:1입니다.","steps":["이상 변압기는 전압비=권수비입니다.","N1:N2=2:1입니다.","V1:V2=2:1입니다."]},{"id":9013,"lesson":5,"level":"보통","q":"이상 변압기 1차 200V, 권수비 5:1일 때 2차 전압은?","opts":["20V","40V","100V","1000V"],"a":1,"why":"V1/V2=N1/N2=5입니다. → V2=200÷5입니다. → 40V입니다.","steps":["V1/V2=N1/N2=5입니다.","V2=200÷5입니다.","40V입니다."]},{"id":9014,"lesson":5,"level":"보통","q":"변압기 입력 1000W, 출력 900W일 때 효율은?","opts":["80%","85%","90%","95%"],"a":2,"why":"효율=출력/입력×100입니다. → 900÷1000×100입니다. → 90%입니다.","steps":["효율=출력/입력×100입니다.","900÷1000×100입니다.","90%입니다."]},{"id":9015,"lesson":5,"level":"보통","q":"4극 유도전동기를 60Hz에서 운전할 때 동기속도는?","opts":["900rpm","1200rpm","1800rpm","3600rpm"],"a":2,"why":"동기속도 Ns=120f/P입니다. → 120×60÷4입니다. → 1800rpm입니다.","steps":["동기속도 Ns=120f/P입니다.","120×60÷4입니다.","1800rpm입니다."]},{"id":9016,"lesson":5,"level":"어려움","q":"6극 유도전동기, 60Hz에서 동기속도는?","opts":["600rpm","900rpm","1200rpm","1800rpm"],"a":2,"why":"Ns=120f/P입니다. → 120×60÷6입니다. → 1200rpm입니다.","steps":["Ns=120f/P입니다.","120×60÷6입니다.","1200rpm입니다."]},{"id":9017,"lesson":5,"level":"어려움","q":"동기속도 1800rpm, 회전자 속도 1710rpm이면 슬립은?","opts":["2%","3%","5%","10%"],"a":2,"why":"슬립 s=(Ns−N)/Ns입니다. → (1800−1710)/1800=0.05입니다. → 5%입니다.","steps":["슬립 s=(Ns−N)/Ns입니다.","(1800−1710)/1800=0.05입니다.","5%입니다."]},{"id":9018,"lesson":5,"level":"어려움","q":"입력 2kW, 효율 80%인 전동기의 기계적 출력은?","opts":["0.4kW","1.2kW","1.6kW","2.5kW"],"a":2,"why":"효율=출력/입력입니다. → 출력=2×0.8입니다. → 1.6kW입니다.","steps":["효율=출력/입력입니다.","출력=2×0.8입니다.","1.6kW입니다."]},{"id":9019,"lesson":6,"level":"쉬움","q":"송전선의 저항으로 발생하는 전력손실 공식은?","opts":["IR","I²R","V/I","VI²"],"a":1,"why":"도선에 전류가 흐르면 저항 손실이 발생합니다. → 줄손실은 전류의 제곱에 비례합니다. → P손실=I²R입니다.","steps":["도선에 전류가 흐르면 저항 손실이 발생합니다.","줄손실은 전류의 제곱에 비례합니다.","P손실=I²R입니다."]},{"id":9020,"lesson":6,"level":"쉬움","q":"송전전압을 높이는 대표적인 이유는?","opts":["주파수 증가","같은 전력에서 전류 감소","저항 증가","역률 0으로 감소"],"a":1,"why":"전력 전달은 전압과 전류의 곱에 관계됩니다. → 같은 전력에서 전압을 높이면 전류를 줄일 수 있습니다. → 저항 손실을 줄이는 데 도움이 됩니다.","steps":["전력 전달은 전압과 전류의 곱에 관계됩니다.","같은 전력에서 전압을 높이면 전류를 줄일 수 있습니다.","저항 손실을 줄이는 데 도움이 됩니다."]},{"id":9021,"lesson":6,"level":"쉬움","q":"차단기의 주요 목적은?","opts":["전기요금 측정","고장전류 차단","주파수 생성","전압 증폭"],"a":1,"why":"단락·과전류 등 이상 상태를 생각합니다. → 보호장치가 고장 회로를 분리합니다. → 고장전류 차단이 핵심입니다.","steps":["단락·과전류 등 이상 상태를 생각합니다.","보호장치가 고장 회로를 분리합니다.","고장전류 차단이 핵심입니다."]},{"id":9022,"lesson":6,"level":"보통","q":"저항 2Ω 선로에 전류 5A가 흐르면 손실은?","opts":["10W","25W","50W","100W"],"a":2,"why":"P손실=I²R입니다. → 5²×2=25×2입니다. → 50W입니다.","steps":["P손실=I²R입니다.","5²×2=25×2입니다.","50W입니다."]},{"id":9023,"lesson":6,"level":"보통","q":"동일한 선로에서 전류를 절반으로 줄이면 저항 손실은 원래의?","opts":["1/2","1/3","1/4","1/8"],"a":2,"why":"손실은 I²에 비례합니다. → (I/2)²=I²/4입니다. → 원래의 1/4입니다.","steps":["손실은 I²에 비례합니다.","(I/2)²=I²/4입니다.","원래의 1/4입니다."]},{"id":9024,"lesson":6,"level":"보통","q":"역률 1인 단상 220V, 10A 부하의 유효전력은?","opts":["220W","1100W","2200W","4400W"],"a":2,"why":"단상 유효전력 P=VIcosφ입니다. → 220×10×1입니다. → 2200W입니다.","steps":["단상 유효전력 P=VIcosφ입니다.","220×10×1입니다.","2200W입니다."]},{"id":9025,"lesson":6,"level":"어려움","q":"3상 평형부하에서 선간전압 380V, 선전류 10A, 역률 1일 때 유효전력에 가장 가까운 값은?","opts":["2.2kW","3.8kW","6.58kW","11.4kW"],"a":2,"why":"3상 P=√3 V_L I_L cosφ입니다. → 1.732×380×10입니다. → 약 6.5 입니다."]},{"id":9033,"lesson":7,"level":"보통","q":"허용전류를 판단할 때 중요한 조건은?","opts":["전선 색상만","도체 단면적·포설조건·주위온도","건물 층수만","전기요금"],"a":1,"why":"전선 온도 상승은 여러 조건에 좌우됩니다. → 단면적과 포설 및 온도 조건을 고려합니다. → 두 번째 선택지가 맞습니다.","steps":["전선 온도 상승은 여러 조건에 좌우됩니다.","단면적과 포설 및 온도 조건을 고려합니다.","두 번째 선택지가 맞습니다."]},{"id":9034,"lesson":7,"level":"어려움","q":"접지저항이 10Ω이고 접지전류가 2A 흐를 때 단순 저항 모델의 전압강하는?","opts":["5V","10V","20V","40V"],"a":2,"why":"옴의 법칙 V=IR입니다. → 2×10을 계산합니다. → 20V입니다. 실제 접촉전압은 접지계통에 따라 다릅니다.","steps":["옴의 법칙 V=IR입니다.","2×10을 계산합니다.","20V입니다. 실제 접촉전압은 접지계통에 따라 다릅니다."]},{"id":9035,"lesson":7,"level":"어려움","q":"단순 저항 모델에서 5Ω에 4A가 흐르면 전압강하는?","opts":["1.25V","9V","20V","40V"],"a":2,"why":"V=IR입니다. → 4×5를 계산합니다. → 20V입니다.","steps":["V=IR입니다.","4×5를 계산합니다.","20V입니다."]},{"id":9036,"lesson":7,"level":"어려움","q":"누전차단기 정격감도전류 30mA는 몇 A인가?","opts":["0.003A","0.03A","0.3A","3A"],"a":1,"why":"mA는 A의 1/1000입니다. → 30÷1000입니다. → 0.03A입니다. 실제 적용 요건은 KEC 최신 규정을 확인하세요.","steps":["mA는 A의 1/1000입니다.","30÷1000입니다.","0.03A입니다. 실제 적용 요건은 KEC 최신 규정을 확인하세요."]},{"id":9037,"lesson":8,"level":"쉬움","q":"옴의 법칙에 맞는 식은?","opts":["V=IR","V=I/R","R=VI","I=VR"],"a":0,"why":"전압은 전류와 저항의 곱입니다. → V=I×R입니다. → 첫 번째 식이 맞습니다.","steps":["전압은 전류와 저항의 곱입니다.","V=I×R입니다.","첫 번째 식이 맞습니다."]},{"id":9038,"lesson":8,"level":"쉬움","q":"병렬회로에서 같은 것은?","opts":["전류","전압","저항","전력"],"a":1,"why":"각 가지는 같은 두 접점에 연결됩니다. → 두 접점의 전위차가 같습니다. → 전압이 같습니다.","steps":["각 가지는 같은 두 접점에 연결됩니다.","두 접점의 전위차가 같습니다.","전압이 같습니다."]},{"id":9039,"lesson":8,"level":"쉬움","q":"전력의 단위는?","opts":["A","V","W","Ω"],"a":2,"why":"전력은 단위시간당 에너지입니다. → SI 단위는 와트입니다. → W입니다.","steps":["전력은 단위시간당 에너지입니다.","SI 단위는 와트입니다.","W입니다."]},{"id":9040,"lesson":8,"level":"보통","q":"전압 30V, 저항 10Ω이면 전류는?","opts":["1A","2A","3A","5A"],"a":2,"why":"I=V/R입니다. → 30÷10입니다. → 3A입니다.","steps":["I=V/R입니다.","30÷10입니다.","3A입니다."]},{"id":9041,"lesson":8,"level":"보통","q":"저항 4Ω과 6Ω의 직렬 합성저항은?","opts":["2Ω","5Ω","10Ω","24Ω"],"a":2,"why":"직렬저항은 합산합니다. → 4+6입니다. → 10Ω입니다.","steps":["직렬저항은 합산합니다.","4+6입니
